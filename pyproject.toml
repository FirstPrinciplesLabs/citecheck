[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citecheck-hallucination"
version = "0.1.0"
description = "CiteCheck: retrieval-grounded detection of LLM citation hallucinations in scientific text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Khashayar Khajavi" },
]
keywords = ["hallucination", "citation", "verification", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # HTTP client for the external-API cascade
    "httpx>=0.27.0",

    # LLM stack
    "openai>=1.50.0",
    "anthropic>=0.45.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",

    # Data validation and structured output
    "pydantic>=2.6.0",

    # Threshold tuning
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",

    # YAML configs (citecheck-evaluate / citecheck-compare)
    "pyyaml>=6.0",

    # Misc
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
monitoring = [
    "psutil>=5.9.0",
]
plot = [
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
citecheck-evaluate  = "citecheck.cli.evaluate:main"
citecheck-baseline  = "citecheck.cli.baseline_run:main"
citecheck-compare   = "citecheck.cli.baseline_compare:main"

[project.urls]
Homepage = "https://github.com/FirstPrinciplesLabs/citecheck"
Repository = "https://github.com/FirstPrinciplesLabs/citecheck"
Issues = "https://github.com/FirstPrinciplesLabs/citecheck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citecheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["tests"]
